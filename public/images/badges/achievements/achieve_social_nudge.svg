<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none" class="w-full h-full">
  <defs>
    <filter id="sn-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#854d0e" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#eab308" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="sn-plate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2206"/>
      <stop offset="100%" stop-color="#0f0c02"/>
    </linearGradient>
    <linearGradient id="sn-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <linearGradient id="sn-spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>

  <!-- 8-Point Star Plate -->
  <polygon points="80,10 98,42 134,30 122,66 150,84 122,102 134,138 98,126 80,158 62,126 26,138 38,102 10,84 38,66 26,30 62,42" fill="url(#sn-plate)" stroke="url(#sn-rim)" stroke-width="4" stroke-linejoin="round" filter="url(#sn-glow)"/>

  <!-- Origami Lightning Beacon -->
  <g transform="translate(0, -2)">
    <!-- Beacon Rays -->
    <path d="M80 32 L88 64 L120 72 L88 80 L80 112 L72 80 L40 72 L72 64 Z" fill="url(#sn-spark)"/>
    <!-- Folded Lightning Facets -->
    <polygon points="80,32 88,64 80,72" fill="#facc15"/>
    <polygon points="120,72 88,80 80,72" fill="#eab308"/>
    <polygon points="80,112 72,80 80,72" fill="#ca8a04"/>
    <polygon points="40,72 72,64 80,72" fill="#fef08a"/>
    <!-- Center Core Glow -->
    <circle cx="80" cy="72" r="8" fill="#ffffff"/>
  </g>

  <!-- Nudge Label -->
  <rect x="56" y="122" width="48" height="18" rx="9" fill="#a16207" stroke="#fef08a" stroke-width="1.5"/>
  <text x="80" y="135" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="9" letter-spacing="1">NUDGE</text>
</svg>