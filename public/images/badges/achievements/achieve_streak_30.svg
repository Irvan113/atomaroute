<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none" class="w-full h-full">
  <defs>
    <filter id="strk30-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#000000" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#fbbf24" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="s30-plate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c160c"/>
      <stop offset="100%" stop-color="#0a0803"/>
    </linearGradient>
    <linearGradient id="s30-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="30%" stop-color="#fbbf24"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="s30-gold-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="s30-gold-r" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <!-- 12-pointed Sun Shield Outer -->
  <circle cx="80" cy="80" r="70" fill="url(#s30-plate)" stroke="url(#s30-rim)" stroke-width="5" filter="url(#strk30-glow)"/>
  <circle cx="80" cy="80" r="58" stroke="#fbbf24" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="5 3" fill="none"/>

  <!-- Radiant Triple Origami Flame & Solar Crown -->
  <g id="inferno-flame" transform="translate(0, -3)">
    <!-- Left Wing -->
    <path d="M52 46 L70 78 L52 110 L34 82 Z" fill="url(#s30-gold-l)" opacity="0.9"/>
    <path d="M52 46 L70 78 L52 110 Z" fill="#b45309" opacity="0.9"/>
    <!-- Right Wing -->
    <path d="M108 46 L126 82 L108 110 L90 78 Z" fill="url(#s30-gold-r)" opacity="0.9"/>
    <path d="M108 46 L90 78 L108 110 Z" fill="#d97706" opacity="0.9"/>
    <!-- Towering Center Flame -->
    <path d="M80 18 L100 64 L80 118 L60 64 Z" fill="url(#s30-gold-l)"/>
    <path d="M80 18 L100 64 L80 118 Z" fill="url(#s30-gold-r)"/>
    <!-- Crown Points on top of flame -->
    <polygon points="80,18 84,32 80,40 76,32" fill="#ffffff"/>
    <!-- Luminous Core Crystal -->
    <polygon points="80,44 90,74 80,102 70,74" fill="#fef08a"/>
    <polygon points="80,44 90,74 80,102" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Tier 30 Label Pill -->
  <rect x="54" y="122" width="52" height="20" rx="10" fill="url(#s30-rim)" stroke="#fef08a" stroke-width="1.5"/>
  <text x="80" y="136" text-anchor="middle" fill="#451a03" font-family="system-ui, sans-serif" font-weight="900" font-size="11" letter-spacing="1">30D</text>
</svg>