<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none" class="w-full h-full">
  <defs>
    <filter id="ac-wo-sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.4"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#38bdf8" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="ac-wo-g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>
  <g filter="url(#ac-wo-sh)">
    <polygon points="80,16 130,44 130,100 80,128 30,100 30,44" fill="#0b1329" stroke="#38bdf8" stroke-width="2.5"/>
    <!-- Folded Hexagonal Dumbbell -->
    <!-- Center Bar -->
    <rect x="58" y="74" width="44" height="8" fill="#38bdf8" rx="2"/>
    <!-- Left Weight Plate -->
    <polygon points="54,52 64,52 64,104 54,104 46,92 46,64" fill="url(#ac-wo-g)"/>
    <!-- Right Weight Plate -->
    <polygon points="106,52 114,64 114,92 106,104 96,104 96,52" fill="url(#ac-wo-g)"/>
  </g>
</svg>