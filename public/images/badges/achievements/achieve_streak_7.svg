<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none" class="w-full h-full">
  <defs>
    <filter id="strk7-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#78350f" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#d97706" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="s7-plate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#291e14"/>
      <stop offset="100%" stop-color="#140d07"/>
    </linearGradient>
    <linearGradient id="s7-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="s7-flame-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="s7-flame-r" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <!-- Circular Outer Plate -->
  <circle cx="80" cy="80" r="68" fill="url(#s7-plate)" stroke="url(#s7-rim)" stroke-width="4.5" filter="url(#strk7-glow)"/>
  <circle cx="80" cy="80" r="58" stroke="#f59e0b" stroke-opacity="0.25" stroke-dasharray="4 3" stroke-width="1.5" fill="none"/>

  <!-- Single Origami Flame (Bronze / Ember Tier) -->
  <g id="ember-flame" transform="translate(0, 2)">
    <!-- Base Outer Facets -->
    <path d="M80 30 L98 68 L80 118 L62 68 Z" fill="url(#s7-flame-l)"/>
    <path d="M80 30 L98 68 L80 118 Z" fill="url(#s7-flame-r)"/>
    <!-- Lower Wings -->
    <path d="M62 68 L48 88 L65 106 L80 118 Z" fill="#92400e"/>
    <path d="M98 68 L112 88 L95 106 L80 118 Z" fill="#78350f"/>
    <!-- Bright Core Shard -->
    <path d="M80 50 L88 78 L80 102 L72 78 Z" fill="#fde68a"/>
    <path d="M80 50 L88 78 L80 102 Z" fill="#fef3c7" opacity="0.8"/>
  </g>

  <!-- Tier 7 Label Pill -->
  <rect x="58" y="122" width="44" height="18" rx="9" fill="#78350f" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="80" y="135" text-anchor="middle" fill="#fde68a" font-family="system-ui, sans-serif" font-weight="900" font-size="10" letter-spacing="1">7D</text>
</svg>