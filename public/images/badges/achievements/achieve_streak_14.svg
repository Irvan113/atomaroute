<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none" class="w-full h-full">
  <defs>
    <filter id="strk14-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#1e293b" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#38bdf8" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="s14-plate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="s14-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="s14-cyan-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="s14-cyan-r" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>

  <!-- Octagon Outer Rim -->
  <polygon points="80,10 130,30 150,80 130,130 80,150 30,130 10,80 30,30" fill="url(#s14-plate)" stroke="url(#s14-rim)" stroke-width="4.5" stroke-linejoin="round" filter="url(#strk14-glow)"/>
  <polygon points="80,20 122,37 138,80 122,123 80,140 38,123 22,80 38,37" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5" fill="none"/>

  <!-- Dual Origami Flame (Silver & Cyan Blaze) -->
  <g id="dual-flame" transform="translate(0, -2)">
    <!-- Left Wing Flame -->
    <path d="M60 42 L72 76 L56 108 L40 76 Z" fill="url(#s14-cyan-l)" opacity="0.85"/>
    <!-- Right Wing Flame -->
    <path d="M100 42 L120 76 L104 108 L88 76 Z" fill="url(#s14-cyan-r)" opacity="0.85"/>
    <!-- Central Prominent Flame -->
    <path d="M80 24 L96 66 L80 114 L64 66 Z" fill="url(#s14-cyan-l)"/>
    <path d="M80 24 L96 66 L80 114 Z" fill="url(#s14-cyan-r)"/>
    <!-- Silver Diamond Core -->
    <polygon points="80,48 88,72 80,96 72,72" fill="#ffffff"/>
    <polygon points="80,48 88,72 80,96" fill="#cbd5e1"/>
  </g>

  <!-- Tier 14 Label Pill -->
  <rect x="56" y="122" width="48" height="18" rx="9" fill="#0369a1" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="80" y="135" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="10" letter-spacing="1">14D</text>
</svg>