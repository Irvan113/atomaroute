<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none" class="w-full h-full">
  <defs>
    <filter id="t50-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0c4a6e" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#0284c7" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="t50-plate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c2338"/>
      <stop offset="100%" stop-color="#040e18"/>
    </linearGradient>
    <linearGradient id="t50-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="t50-blue-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="t50-blue-r" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>

  <!-- Octagon Shield -->
  <polygon points="80,10 132,32 150,80 132,128 80,150 28,128 10,80 28,32" fill="url(#t50-plate)" stroke="url(#t50-rim)" stroke-width="4.5" stroke-linejoin="round" filter="url(#t50-glow)"/>
  <polygon points="80,20 122,38 138,80 122,122 80,140 38,122 22,80 38,38" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5" fill="none"/>

  <!-- Dual Origami Checkmark Crest (Task 50) -->
  <g transform="translate(0, -4)">
    <!-- Background Shadow Checkmark -->
    <path d="M46 76 L66 96 L112 50 L104 42 L66 80 L54 68 Z" fill="#0369a1" opacity="0.6"/>
    <!-- Foreground Primary Checkmark -->
    <path d="M40 84 L64 108 L72 98 L48 74 Z" fill="url(#t50-blue-l)"/>
    <path d="M64 108 L124 48 L114 38 L56 96 Z" fill="url(#t50-blue-r)"/>
    <!-- High Fold Facet -->
    <polygon points="64,108 56,96 72,98" fill="#0c4a6e"/>
    <!-- Top Geometric Wing Chevron -->
    <polygon points="80,28 92,40 80,52 68,40" fill="#e0f2fe"/>
  </g>

  <!-- Tier 50 Label -->
  <rect x="56" y="122" width="48" height="18" rx="9" fill="#0284c7" stroke="#bae6fd" stroke-width="1.5"/>
  <text x="80" y="135" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="10" letter-spacing="1">50</text>
</svg>