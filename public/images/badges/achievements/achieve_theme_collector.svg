<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none" class="w-full h-full">
  <defs>
    <filter id="tc-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#4c1d95" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#8b5cf6" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="tc-plate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f0728"/>
    </linearGradient>
    <linearGradient id="tc-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>

  <!-- Hexagon Outer -->
  <polygon points="80,12 138,45 138,115 80,148 22,115 22,45" fill="url(#tc-plate)" stroke="url(#tc-rim)" stroke-width="4.5" stroke-linejoin="round" filter="url(#tc-glow)"/>

  <!-- Origami Prismatic Palette Crystal -->
  <g transform="translate(0, -2)">
    <!-- Cyan Facet -->
    <polygon points="80,34 110,64 80,80" fill="#06b6d4"/>
    <!-- Rose Facet -->
    <polygon points="110,64 96,106 80,80" fill="#f43f5e"/>
    <!-- Amber Facet -->
    <polygon points="96,106 64,106 80,80" fill="#f59e0b"/>
    <!-- Emerald Facet -->
    <polygon points="64,106 50,64 80,80" fill="#10b981"/>
    <!-- Purple Facet -->
    <polygon points="50,64 80,34 80,80" fill="#8b5cf6"/>

    <!-- Central White Diamond Core -->
    <polygon points="80,68 88,80 80,92 72,80" fill="#ffffff"/>
  </g>

  <!-- 3x Label -->
  <rect x="58" y="122" width="44" height="18" rx="9" fill="#6d28d9" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="80" y="135" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="10" letter-spacing="1">THEME</text>
</svg>