<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" class="w-full h-full">
  <defs>
    <filter id="t4-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#082f49" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0284c7" flood-opacity="0.35"/>
    </filter>

    <filter id="t4-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Celestial Platinum Gradients -->
    <linearGradient id="t4-plat-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#e0f2fe"/>
      <stop offset="70%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>

    <linearGradient id="t4-plat-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>

    <radialGradient id="t4-cavity-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#072338"/>
      <stop offset="70%" stop-color="#03121d"/>
      <stop offset="100%" stop-color="#01060a"/>
    </radialGradient>

    <!-- Celestial Diamond Cut Gradients -->
    <linearGradient id="t4-gem-apex" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="t4-gem-facets-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="t4-gem-facets-r" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5edfff"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <linearGradient id="t4-gem-table" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#ecfcff"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
  </defs>

  <g filter="url(#t4-shadow)">
    <!-- 1. BASE FRAME: TRIPLE-TIERED CELESTIAL WINGS & CROWN FINIALS -->
    <!-- Top Crown Notches -->
    <polygon points="100,24 107,35 93,35" fill="url(#t4-plat-light)"/>
    <polygon points="85,28 92,38 80,38" fill="url(#t4-plat-dark)"/>
    <polygon points="115,28 120,38 108,38" fill="url(#t4-plat-dark)"/>

    <!-- Left Wing Tier 1 (High Flange) -->
    <path d="M50 70 L6 76 C3 77 2 80 3 83 L12 95 C13 97 16 98 19 97 L50 88 Z" fill="url(#t4-plat-light)"/>
    <path d="M48 72 L8 78 L16 93 L48 86 Z" fill="#ffffff" opacity="0.8"/>
    
    <!-- Left Wing Tier 2 (Mid Flange) -->
    <path d="M48 90 L12 102 C10 103 9 106 10 109 L18 122 C19 124 22 125 25 124 L48 114 Z" fill="url(#t4-plat-dark)"/>

    <!-- Left Wing Tier 3 (Bottom Swept) -->
    <path d="M46 116 L22 128 C20 129 19 132 20 135 L27 146 C28 148 31 149 34 148 L48 138 Z" fill="url(#t4-plat-dark)"/>

    <!-- Right Wing Tier 1 (High Flange) -->
    <path d="M150 70 L194 76 C197 77 198 80 197 83 L188 95 C187 97 184 98 181 97 L150 88 Z" fill="url(#t4-plat-light)"/>
    <path d="M152 72 L192 78 L184 93 L152 86 Z" fill="#ffffff" opacity="0.8"/>

    <!-- Right Wing Tier 2 (Mid Flange) -->
    <path d="M152 90 L188 102 C190 103 191 106 190 109 L182 122 C181 124 178 125 175 124 L152 114 Z" fill="url(#t4-plat-dark)"/>

    <!-- Right Wing Tier 3 (Bottom Swept) -->
    <path d="M154 116 L178 128 C180 129 181 132 180 135 L173 146 C172 148 169 149 166 148 L152 138 Z" fill="url(#t4-plat-dark)"/>

    <!-- Main Titanium Crest Body -->
    <polygon points="100,32 168,70 168,140 100,178 32,140 32,70" fill="url(#t4-plat-dark)"/>
    <polygon points="100,36 163,72 163,137 100,173 37,137 37,72" fill="url(#t4-plat-light)"/>

    <!-- 3D Geometric Facets -->
    <polygon points="100,36 163,72 148,81 100,53 52,81 37,72" fill="#ffffff" opacity="0.9"/>
    <polygon points="100,173 163,137 148,128 100,156 52,128 37,137" fill="#082f49" opacity="0.8"/>
    <polygon points="37,72 52,81 52,128 37,137" fill="#38bdf8" opacity="0.6"/>
    <polygon points="163,72 148,81 148,128 163,137" fill="#0284c7" opacity="0.6"/>

    <!-- Deep Space Cavity -->
    <polygon points="100,53 148,81 148,128 100,156 52,128 52,81" fill="url(#t4-cavity-bg)"/>
    <polygon points="100,53 148,81 148,128 100,156 52,128 52,81" stroke="#38bdf8" stroke-width="1.8" stroke-opacity="0.9"/>

    <!-- Dual Orbit Rings -->
    <ellipse cx="100" cy="105" rx="38" ry="18" fill="none" stroke="#5edfff" stroke-width="1.2" stroke-dasharray="6 3" opacity="0.7" transform="rotate(-15 100 105)"/>
    <ellipse cx="100" cy="105" rx="38" ry="18" fill="none" stroke="#ffffff" stroke-width="0.8" stroke-dasharray="3 4" opacity="0.4" transform="rotate(25 100 105)"/>

    <!-- 2. CENTER GEMSTONE: BRILLIANT-CUT HEXAGONAL CELESTIAL DIAMOND -->
    <g filter="url(#t4-glow)">
      <!-- Hexagonal Brilliant Geometry -->
      <polygon points="100,64 128,80 128,130 100,146 72,130 72,80" fill="#0284c7"/>

      <!-- Crown Facets -->
      <polygon points="100,64 128,80 116,92 100,82 84,92 72,80" fill="url(#t4-gem-apex)"/>
      <polygon points="72,80 84,92 84,118 72,130" fill="url(#t4-gem-facets-l)"/>
      <polygon points="128,80 128,130 116,118 116,92" fill="url(#t4-gem-facets-r)"/>
      <polygon points="72,130 84,118 100,128 100,146" fill="url(#t4-gem-facets-l)"/>
      <polygon points="128,130 100,146 100,128 116,118" fill="url(#t4-gem-facets-r)"/>

      <!-- Brilliant Table Facet -->
      <polygon points="100,82 116,92 116,118 100,128 84,118 84,92" fill="url(#t4-gem-table)"/>

      <!-- Inner Octahedral Light Core -->
      <polygon points="100,86 112,105 100,124 88,105" fill="#ffffff" opacity="0.6"/>

      <!-- Star Glints -->
      <line x1="84" y1="92" x2="116" y2="118" stroke="#ffffff" stroke-width="1.2" opacity="0.8"/>
      <line x1="116" y1="92" x2="84" y2="118" stroke="#ffffff" stroke-width="1.2" opacity="0.8"/>
      <path d="M100 60 Q100 64 104 64 Q100 64 100 68 Q100 64 96 64 Q100 64 100 60 Z" fill="#ffffff"/>
      <path d="M128 76 Q128 79 131 79 Q128 79 128 82 Q128 79 125 79 Q128 79 128 76 Z" fill="#ffffff"/>
    </g>
  </g>
</svg>