<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" class="w-full h-full">
  <defs>
    <filter id="t3-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.4"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#eab308" flood-opacity="0.3"/>
    </filter>

    <filter id="t3-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Imperial Gold Gradients -->
    <linearGradient id="t3-gold-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="30%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <linearGradient id="t3-gold-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ca8a04"/>
      <stop offset="50%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>

    <radialGradient id="t3-cavity-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a1b3a"/>
      <stop offset="70%" stop-color="#050e1f"/>
      <stop offset="100%" stop-color="#02050b"/>
    </radialGradient>

    <!-- ATOMA Electric Royal Blue Gemstone Gradients -->
    <linearGradient id="t3-gem-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#3e64ff"/>
    </linearGradient>

    <linearGradient id="t3-gem-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3e64ff"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <linearGradient id="t3-gem-right" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>

    <linearGradient id="t3-gem-table" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>

  <g filter="url(#t3-shadow)">
    <!-- 1. BASE FRAME: IMPERIAL GOLD SWEPT WINGS -->
    <!-- Left Wing Main -->
    <path d="M52 76 L8 84 C5 85 4 88 5 91 L14 105 C15 107 18 108 21 107 L52 96 Z" fill="url(#t3-gold-light)"/>
    <path d="M50 78 L10 86 L18 103 L50 94 Z" fill="#ffffff" opacity="0.6"/>
    
    <!-- Left Wing Lower Tier -->
    <path d="M48 100 L18 112 C16 113 15 116 16 119 L24 133 C25 136 29 137 32 136 L50 124 Z" fill="url(#t3-gold-dark)"/>

    <!-- Right Wing Main -->
    <path d="M148 76 L192 84 C195 85 196 88 195 91 L186 105 C185 107 182 108 179 107 L148 96 Z" fill="url(#t3-gold-light)"/>
    <path d="M150 78 L190 86 L182 103 L150 94 Z" fill="#ffffff" opacity="0.6"/>

    <!-- Right Wing Lower Tier -->
    <path d="M152 100 L182 112 C184 113 185 116 184 119 L176 133 C175 136 171 137 168 136 L150 124 Z" fill="url(#t3-gold-dark)"/>

    <!-- Golden Hexagonal Crest Collar -->
    <polygon points="100,32 165,70 165,140 100,178 35,140 35,70" fill="url(#t3-gold-dark)"/>
    <polygon points="100,36 161,72 161,137 100,173 39,137 39,72" fill="url(#t3-gold-light)"/>

    <!-- Golden 3D Bevel Facets -->
    <polygon points="100,36 161,72 147,81 100,53 53,81 39,72" fill="#ffffff" opacity="0.85"/>
    <polygon points="100,173 161,137 147,128 100,156 53,128 39,137" fill="#713f12" opacity="0.75"/>
    <polygon points="39,72 53,81 53,128 39,137" fill="#ca8a04" opacity="0.7"/>
    <polygon points="161,72 147,81 147,128 161,137" fill="#a16207" opacity="0.75"/>

    <!-- Recessed Midnight Blue Cavity -->
    <polygon points="100,53 147,81 147,128 100,156 53,128 53,81" fill="url(#t3-cavity-bg)"/>
    <polygon points="100,53 147,81 147,128 100,156 53,128 53,81" stroke="#eab308" stroke-width="1.8" stroke-opacity="0.8"/>

    <!-- ATOMA Atomic Orbit Line -->
    <ellipse cx="100" cy="105" rx="36" ry="17" fill="none" stroke="#3e64ff" stroke-width="1.2" stroke-dasharray="5 3" opacity="0.65" transform="rotate(-15 100 105)"/>

    <!-- 2. CENTER GEMSTONE: ATOMA SIGNATURE ROYAL BLUE SAPPHIRE -->
    <g filter="url(#t3-glow)">
      <!-- Faceted Octahedron Diamond -->
      <polygon points="100,66 127,105 100,99" fill="url(#t3-gem-top)"/>
      <polygon points="100,66 100,99 73,105" fill="url(#t3-gem-top)" opacity="0.9"/>
      
      <polygon points="100,144 100,111 127,105" fill="url(#t3-gem-right)"/>
      <polygon points="100,144 73,105 100,111" fill="url(#t3-gem-left)"/>

      <!-- Center Sapphire Table -->
      <polygon points="100,75 119,105 100,135 81,105" fill="url(#t3-gem-table)"/>

      <!-- Prismatic Diamond Star Reflection -->
      <polygon points="100,80 104,101 122,105 104,109 100,130 96,109 78,105 96,101" fill="#ffffff" opacity="0.6"/>
      <line x1="100" y1="75" x2="81" y2="105" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.95"/>
      <path d="M100 62 Q100 66 104 66 Q100 66 100 70 Q100 66 96 66 Q100 66 100 62 Z" fill="#ffffff"/>
    </g>
  </g>
</svg>