<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none" class="w-full h-full">
  <defs>
    <filter id="p5-shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="7" flood-color="#000000" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#d946ef" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#fbbf24" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="p5-gold-crown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="p5-left-leg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="40%" stop-color="#f43f5e"/>
      <stop offset="80%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="p5-right-leg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="25%" stop-color="#d946ef"/>
      <stop offset="70%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#581c87"/>
    </linearGradient>
    <linearGradient id="p5-crossbar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#4c0519"/>
    </linearGradient>
  </defs>

  <g filter="url(#p5-shadow)">
    <!-- Apex Triple Crown Finial on Top of "A" -->
    <polygon points="78,16 88,30 68,30" fill="url(#p5-gold-crown)"/>
    <polygon points="56,22 66,34 50,34" fill="url(#p5-gold-crown)" opacity="0.9"/>
    <polygon points="100,22 106,34 90,34" fill="url(#p5-gold-crown)" opacity="0.9"/>

    <!-- Left Leg in Radiant Gold-to-Magenta -->
    <path d="M34 128 L58 128 L88 30 L64 30 Z" fill="url(#p5-left-leg)"/>
    <!-- Gold Facet Inset -->
    <polygon points="64,30 76,30 52,128 40,128" fill="url(#p5-gold-crown)" opacity="0.8"/>

    <!-- Crossbar Ribbon -->
    <path d="M50 94 L110 94 L102 76 L44 76 Z" fill="url(#p5-crossbar)"/>
    <!-- Fold Crease Shadow -->
    <polygon points="86,76 110,94 98,94 76,76" fill="#1e0210" opacity="0.55"/>

    <!-- Right Leg Overlapping Fold in Cosmic Magenta-Violet -->
    <path d="M64 30 L88 30 L126 128 L102 128 L88 84 L74 84 Z" fill="url(#p5-right-leg)"/>

    <!-- Divine Apex Highlight Cut -->
    <polygon points="64,30 88,30 76,44" fill="#ffffff" opacity="0.9"/>
    <line x1="76" y1="30" x2="114" y2="128" stroke="#fef08a" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>