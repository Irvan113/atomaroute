<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none" class="w-full h-full">
  <defs>
    <filter id="p3-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#f59e0b" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p3-left-leg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="p3-right-leg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="p3-crossbar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
  </defs>

  <g filter="url(#p3-shadow)">
    <!-- Base Wing Prism Fin Extension on Left Leg -->
    <path d="M28 128 L46 112 L46 128 Z" fill="#f59e0b"/>
    <!-- Base Wing Prism Fin Extension on Right Leg -->
    <path d="M132 128 L114 112 L114 128 Z" fill="#991b1b"/>

    <!-- Left Leg -->
    <path d="M38 128 L62 128 L92 34 L68 34 Z" fill="url(#p3-left-leg)"/>
    <!-- Bevel Facet -->
    <polygon points="68,34 80,34 56,128 46,128" fill="#ffffff" opacity="0.4"/>

    <!-- Crossbar Ribbon Fold -->
    <path d="M54 94 L108 94 L100 78 L48 78 Z" fill="url(#p3-crossbar)"/>
    <!-- Fold Crease Drop Shadow -->
    <polygon points="86,78 108,94 96,94 78,78" fill="#000000" opacity="0.45"/>

    <!-- Right Leg Fold -->
    <path d="M68 34 L92 34 L122 128 L98 128 L86 84 L74 84 Z" fill="url(#p3-right-leg)"/>

    <!-- Solar Highlight -->
    <polygon points="68,34 92,34 80,48" fill="#ffffff" opacity="0.75"/>
    <line x1="80" y1="34" x2="110" y2="128" stroke="#fef08a" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>