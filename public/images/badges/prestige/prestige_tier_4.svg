<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none" class="w-full h-full">
  <defs>
    <filter id="p4-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#a855f7" flood-opacity="0.4"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#00f5ff" flood-opacity="0.3"/>
    </filter>
    <!-- Left Leg: Electric Cyan to Royal Blue (Like Reference Image) -->
    <linearGradient id="p4-left-leg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="35%" stop-color="#00c8ff"/>
      <stop offset="70%" stop-color="#3e64ff"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="p4-left-facet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#b2fcff"/>
      <stop offset="100%" stop-color="#3e64ff"/>
    </linearGradient>
    <!-- Right Leg: Royal Blue into Vibrant Violet-Purple -->
    <linearGradient id="p4-right-leg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7928ca"/>
      <stop offset="40%" stop-color="#9333ea"/>
      <stop offset="80%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <!-- Folded Crossbar -->
    <linearGradient id="p4-crossbar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00c8ff"/>
      <stop offset="50%" stop-color="#3e64ff"/>
      <stop offset="100%" stop-color="#581c87"/>
    </linearGradient>
  </defs>

  <g filter="url(#p4-shadow)">
    <!-- Left Leg: Clean angled upward stem in Cyan-Blue -->
    <path d="M36 128 L60 128 L90 32 L66 32 Z" fill="url(#p4-left-leg)"/>
    <!-- Prismatic Left Facet Highlight -->
    <polygon points="66,32 78,32 54,128 42,128" fill="url(#p4-left-facet)" opacity="0.6"/>

    <!-- Crossbar Ribbon with Clean Crisp Folding Angle -->
    <path d="M52 94 L108 94 L100 76 L46 76 Z" fill="url(#p4-crossbar)"/>
    <!-- Fold Crease Shadow under Overlapping Right Leg -->
    <polygon points="86,76 108,94 96,94 76,76" fill="#0f051d" opacity="0.5"/>

    <!-- Right Leg: Overlapping Fold in Electric Violet-Purple -->
    <path d="M66 32 L90 32 L124 128 L100 128 L87 84 L74 84 Z" fill="url(#p4-right-leg)"/>

    <!-- Crisp Apex Corner Highlight (Exact Origami Look) -->
    <polygon points="66,32 90,32 78,44" fill="#ffffff" opacity="0.8"/>
    <!-- Subtle Specular Glint on Right Edge -->
    <line x1="78" y1="32" x2="112" y2="128" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.65"/>
  </g>
</svg>