<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none" class="w-full h-full">
  <defs>
    <filter id="p1-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#000000" flood-opacity="0.32"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#06b6d4" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="p1-left-leg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="60%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="p1-right-leg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="p1-crossbar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
  </defs>

  <g filter="url(#p1-shadow)">
    <!-- FOLDED ATOMA "A" MONOGRAM (Novice Minimalist) -->
    <!-- Left Leg: Upward sweeping stem -->
    <path d="M42 128 L66 128 L94 40 L70 40 Z" fill="url(#p1-left-leg)"/>

    <!-- Crossbar Ribbon (Tucked beneath fold) -->
    <path d="M58 98 L104 98 L98 82 L52 82 Z" fill="url(#p1-crossbar)"/>
    <!-- Fold Crease Shadow on Crossbar -->
    <polygon points="86,82 104,98 94,98 80,82" fill="#000000" opacity="0.3"/>

    <!-- Right Leg: Overlapping downward stem with fold cut -->
    <path d="M70 40 L94 40 L118 128 L94 128 L84 88 L74 88 Z" fill="url(#p1-right-leg)"/>

    <!-- Apex Fold Highlight -->
    <polygon points="70,40 94,40 82,40" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <!-- Inner Counter Cutout (Visual clarity) -->
    <polygon points="80,56 68,90 92,90" fill="#0b1329" opacity="0.15"/>
  </g>
</svg>