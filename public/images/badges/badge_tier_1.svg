<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" class="w-full h-full">
  <defs>
    <filter id="t1-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0284c7" flood-opacity="0.2"/>
    </filter>

    <filter id="t1-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <linearGradient id="t1-mount-main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="30%" stop-color="#cbd5e1"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <linearGradient id="t1-mount-trim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>

    <linearGradient id="t1-mount-bevel-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.25"/>
    </linearGradient>

    <linearGradient id="t1-mount-bevel-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.85"/>
    </linearGradient>

    <radialGradient id="t1-cavity-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0c2e44"/>
      <stop offset="65%" stop-color="#071b29"/>
      <stop offset="100%" stop-color="#030e17"/>
    </radialGradient>

    <linearGradient id="t1-gem-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#b2fcff"/>
      <stop offset="100%" stop-color="#5edfff"/>
    </linearGradient>

    <linearGradient id="t1-gem-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5edfff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="t1-gem-right" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <linearGradient id="t1-gem-table" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#ecfcff"/>
      <stop offset="100%" stop-color="#a5f3fc"/>
    </linearGradient>
  </defs>

  <g filter="url(#t1-shadow)">
    <!-- 1. BASE FRAME (Wings & Outer Mount) -->
    <!-- Left Wing Bracket -->
    <path d="M48 88 L26 94 C24 95 23 98 24 101 L29 116 C30 119 33 121 36 120 L48 116 Z" fill="url(#t1-mount-trim)"/>
    <path d="M48 89 L28 95 L33 114 L48 113 Z" fill="url(#t1-mount-main)"/>
    <path d="M28 95 L48 89 L48 92 L30 97 Z" fill="#ffffff" opacity="0.6"/>

    <!-- Right Wing Bracket -->
    <path d="M152 88 L174 94 C176 95 177 98 176 101 L171 116 C170 119 167 121 164 120 L152 116 Z" fill="url(#t1-mount-trim)"/>
    <path d="M152 89 L172 95 L167 114 L152 113 Z" fill="url(#t1-mount-main)"/>
    <path d="M172 95 L152 89 L152 92 L170 97 Z" fill="#ffffff" opacity="0.6"/>

    <!-- Outer Medallion Rim -->
    <polygon points="100,40 158,74 158,136 100,170 42,136 42,74" fill="url(#t1-mount-trim)"/>
    <polygon points="100,44 154,76 154,134 100,166 46,134 46,76" fill="url(#t1-mount-main)"/>

    <!-- 3D Bevel Highlights -->
    <polygon points="100,44 154,76 142,83 100,60 58,83 46,76" fill="url(#t1-mount-bevel-light)"/>
    <polygon points="100,166 154,134 142,127 100,150 58,127 46,134" fill="url(#t1-mount-bevel-dark)"/>
    <polygon points="46,76 58,83 58,127 46,134" fill="#94a3b8" opacity="0.45"/>
    <polygon points="154,76 142,83 142,127 154,134" fill="#475569" opacity="0.5"/>

    <!-- Recessed Core Cavity -->
    <polygon points="100,60 142,83 142,127 100,150 58,127 58,83" fill="url(#t1-cavity-bg)"/>
    <polygon points="100,60 142,83 142,127 100,150 58,127 58,83" stroke="#0284c7" stroke-width="1.5" stroke-opacity="0.5"/>

    <!-- ATOMA Atomic Orbit Line -->
    <ellipse cx="100" cy="105" rx="34" ry="17" fill="none" stroke="#5edfff" stroke-width="1" stroke-dasharray="4 3" opacity="0.45" transform="rotate(-15 100 105)"/>

    <!-- 2. CENTER GEMSTONE: FACETED ICE-CYAN DIAMOND -->
    <g filter="url(#t1-glow)">
      <!-- Top Apex Facet -->
      <polygon points="100,70 125,105 100,99" fill="url(#t1-gem-top)"/>
      <polygon points="100,70 100,99 75,105" fill="url(#t1-gem-top)" opacity="0.9"/>
      
      <!-- Bottom Apex Facet -->
      <polygon points="100,140 100,111 125,105" fill="url(#t1-gem-right)"/>
      <polygon points="100,140 75,105 100,111" fill="url(#t1-gem-left)"/>

      <!-- Center Table Facet -->
      <polygon points="100,79 117,105 100,131 83,105" fill="url(#t1-gem-table)"/>

      <!-- Star Glint & Specular Highlights -->
      <polygon points="100,83 103,102 118,105 103,108 100,127 97,108 82,105 97,102" fill="#ffffff" opacity="0.5"/>
      <line x1="100" y1="79" x2="83" y2="105" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>
      
      <!-- Sparkle Star at Top Vertex -->
      <path d="M100 66 Q100 70 103 70 Q100 70 100 74 Q100 70 97 70 Q100 70 100 66 Z" fill="#ffffff"/>
    </g>
  </g>
</svg>