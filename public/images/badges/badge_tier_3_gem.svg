<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" class="w-full h-full">
  <defs>
    <filter id="t3-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.4"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#eab308" flood-opacity="0.3"/>
    </filter>

    <filter id="t3-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Imperial Gold Gradients -->
    <linearGradient id="t3-gold-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="30%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <linearGradient id="t3-gold-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ca8a04"/>
      <stop offset="50%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>

    <radialGradient id="t3-cavity-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a1b3a"/>
      <stop offset="70%" stop-color="#050e1f"/>
      <stop offset="100%" stop-color="#02050b"/>
    </radialGradient>

    <!-- ATOMA Electric Royal Blue Gemstone Gradients -->
    <linearGradient id="t3-gem-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#3e64ff"/>
    </linearGradient>

    <linearGradient id="t3-gem-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3e64ff"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <linearGradient id="t3-gem-right" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>

    <linearGradient id="t3-gem-table" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
  <g>
    <!-- 2. CENTER GEMSTONE: ATOMA SIGNATURE ROYAL BLUE SAPPHIRE -->
    <g filter="url(#t3-glow)">
      <!-- Faceted Octahedron Diamond -->
      <polygon points="100,66 127,105 100,99" fill="url(#t3-gem-top)"/>
      <polygon points="100,66 100,99 73,105" fill="url(#t3-gem-top)" opacity="0.9"/>
      
      <polygon points="100,144 100,111 127,105" fill="url(#t3-gem-right)"/>
      <polygon points="100,144 73,105 100,111" fill="url(#t3-gem-left)"/>

      <!-- Center Sapphire Table -->
      <polygon points="100,75 119,105 100,135 81,105" fill="url(#t3-gem-table)"/>

      <!-- Prismatic Diamond Star Reflection -->
      <polygon points="100,80 104,101 122,105 104,109 100,130 96,109 78,105 96,101" fill="#ffffff" opacity="0.6"/>
      <line x1="100" y1="75" x2="81" y2="105" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.95"/>
      <path d="M100 62 Q100 66 104 66 Q100 66 100 70 Q100 66 96 66 Q100 66 100 62 Z" fill="#ffffff"/>
    </g>
  
  </g>
</svg>