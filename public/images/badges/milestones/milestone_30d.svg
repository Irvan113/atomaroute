<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none" class="w-full h-full">
  <defs>
    <filter id="m30-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#000000" flood-opacity="0.38"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#10b981" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="m30-wreath-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="40%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="m30-wreath-r" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="60%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="m30-banner" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="m30-core" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
  </defs>

  <g filter="url(#m30-shadow)">
    <!-- Outer Geometric Hexagonal Ribbon Wreath -->
    <polygon points="80,14 128,42 128,98 80,126 32,98 32,42" fill="url(#m30-wreath-l)"/>
    <polygon points="80,14 128,42 128,98 80,126" fill="url(#m30-wreath-r)"/>

    <!-- Inner Dark Plate -->
    <polygon points="80,24 118,46 118,92 80,114 42,92 42,46" fill="url(#m30-core)"/>

    <!-- >80% Target Progress Arc (Outer Ring) -->
    <circle cx="80" cy="68" r="30" fill="none" stroke="#10b981" stroke-width="3" stroke-dasharray="150 40" stroke-linecap="round"/>
    <circle cx="80" cy="68" r="24" fill="#022c22"/>

    <!-- Number 30 (Bold Modern Typography) -->
    <text x="80" y="77" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-1">30</text>
    <text x="80" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="900" fill="#6ee7b7" text-anchor="middle" letter-spacing="1">HARI</text>

    <!-- Folded Ribbon Banner (>80% Rate Badge) -->
    <!-- Ribbon Left Wing -->
    <path d="M16 122 L38 108 L38 128 L16 142 Z" fill="#047857"/>
    <!-- Ribbon Right Wing -->
    <path d="M144 122 L122 108 L122 128 L144 142 Z" fill="#064e3b"/>

    <!-- Main Front Banner -->
    <polygon points="28,114 132,114 126,134 34,134" fill="url(#m30-banner)"/>
    <text x="80" y="128" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">MILESTONE &gt;80%</text>
  </g>
</svg>