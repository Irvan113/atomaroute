<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none" class="w-full h-full">
  <defs>
    <filter id="mst-shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#c084fc" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="mst-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="30%" stop-color="#fde047"/>
      <stop offset="70%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="mst-purple-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d0fe"/>
      <stop offset="40%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="mst-purple-r" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#7e22ce"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>
    <linearGradient id="mst-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#240747"/>
      <stop offset="100%" stop-color="#0c011a"/>
    </linearGradient>
  </defs>

  <g filter="url(#mst-shadow)">
    <!-- Top Crown Spire in Gold -->
    <polygon points="80,4 90,22 70,22" fill="url(#mst-gold)"/>
    <polygon points="56,12 66,26 50,26" fill="url(#mst-gold)" opacity="0.9"/>
    <polygon points="104,12 110,26 94,26" fill="url(#mst-gold)" opacity="0.9"/>

    <!-- 4-Tiered Grand Master Wings -->
    <path d="M12 38 L34 24 L34 48 L12 62 Z" fill="url(#mst-gold)"/>
    <path d="M148 38 L126 24 L126 48 L148 62 Z" fill="url(#mst-gold)"/>

    <path d="M8 64 L28 50 L28 74 L8 88 Z" fill="url(#mst-purple-l)"/>
    <path d="M152 64 L132 50 L132 74 L152 88 Z" fill="url(#mst-purple-r)"/>

    <path d="M12 90 L30 78 L30 100 L12 112 Z" fill="url(#mst-gold)" opacity="0.9"/>
    <path d="M148 90 L130 78 L130 100 L148 112 Z" fill="url(#mst-gold)" opacity="0.9"/>

    <!-- Main Shield Frame -->
    <polygon points="80,18 28,42 28,104 80,148" fill="url(#mst-purple-l)"/>
    <polygon points="80,18 132,42 132,104 80,148" fill="url(#mst-purple-r)"/>

    <!-- Inner Shield Cavity -->
    <polygon points="80,28 38,50 38,98 80,136" fill="url(#mst-dark)"/>
    <polygon points="80,28 122,50 122,98 80,136" fill="#080012"/>

    <!-- Golden Crowned Apex Emblem in Center -->
    <polygon points="80,44 104,66 80,94 56,66" fill="url(#mst-gold)"/>
    <polygon points="80,44 104,66 80,74" fill="#ffffff" opacity="0.75"/>
    <polygon points="80,44 56,66 80,74" fill="#ffffff" opacity="0.9"/>

    <!-- Center Radiant Violet Star Facet -->
    <polygon points="80,60 92,72 80,84 68,72" fill="#d946ef"/>
    <polygon points="80,60 92,72 80,68" fill="#ffffff" opacity="0.85"/>
</g>
</svg>