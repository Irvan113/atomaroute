<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none" class="w-full h-full">
  <defs>
    <filter id="gld-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#000000" flood-opacity="0.4"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#eab308" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="gld-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="35%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="gld-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="gld-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#1c0a00"/>
    </linearGradient>
    <linearGradient id="gld-atoma-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5edfff"/>
      <stop offset="50%" stop-color="#3e64ff"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <g filter="url(#gld-shadow)">
    <!-- Golden Wing Chevrons -->
    <path d="M18 48 L36 34 L36 58 L18 72 Z" fill="url(#gld-left)"/>
    <path d="M142 48 L124 34 L124 58 L142 72 Z" fill="url(#gld-right)"/>

    <path d="M14 74 L32 60 L32 84 L14 98 Z" fill="url(#gld-left)" opacity="0.9"/>
    <path d="M146 74 L128 60 L128 84 L146 98 Z" fill="url(#gld-right)" opacity="0.9"/>

    <!-- Main Shield Frame -->
    <polygon points="80,14 32,40 32,100 80,144" fill="url(#gld-left)"/>
    <polygon points="80,14 128,40 128,100 80,144" fill="url(#gld-right)"/>

    <!-- Inner Dark Plate -->
    <polygon points="80,24 42,47 42,94 80,130" fill="url(#gld-dark)"/>
    <polygon points="80,24 118,47 118,94 80,130" fill="#1f0900"/>

    <!-- Signature ATOMA Blue Gem Diamond in Center of Gold Shield -->
    <polygon points="80,48 100,72 80,96 60,72" fill="url(#gld-atoma-blue)"/>
    <!-- Gem Facet Highlight -->
    <polygon points="80,48 100,72 80,78" fill="#ffffff" opacity="0.45"/>
    <polygon points="80,48 60,72 80,78" fill="#ffffff" opacity="0.7"/>

    <!-- Golden Chevron Accent Below Diamond -->
    <polygon points="80,102 96,116 80,112 64,116" fill="url(#gld-left)"/>
</g>
</svg>