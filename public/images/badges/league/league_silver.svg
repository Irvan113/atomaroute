<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none" class="w-full h-full">
  <defs>
    <filter id="slv-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.38"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#94a3b8" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="slv-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="slv-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="60%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="slv-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="slv-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>

  <g filter="url(#slv-shadow)">
    <!-- Dual Chevron Wings -->
    <!-- Wing 1 (Top) -->
    <path d="M22 54 L38 42 L38 64 L22 76 Z" fill="url(#slv-left)"/>
    <path d="M138 54 L122 42 L122 64 L138 76 Z" fill="url(#slv-right)"/>
    <!-- Wing 2 (Bottom) -->
    <path d="M18 78 L34 66 L34 88 L18 100 Z" fill="url(#slv-right)"/>
    <path d="M142 78 L126 66 L126 88 L142 100 Z" fill="#334155"/>

    <!-- Main Shield Frame -->
    <polygon points="80,16 34,42 34,98 80,140" fill="url(#slv-left)"/>
    <polygon points="80,16 126,42 126,98 80,140" fill="url(#slv-right)"/>

    <!-- Inner Cavity -->
    <polygon points="80,26 44,48 44,92 80,126" fill="url(#slv-dark)"/>
    <polygon points="80,26 116,48 116,92 80,126" fill="#090d16"/>

    <!-- Center Chevron Spear -->
    <polygon points="80,42 98,62 98,74 80,56 62,74 62,62" fill="url(#slv-core)"/>
    <polygon points="80,64 98,84 98,96 80,78 62,96 62,84" fill="url(#slv-core)"/>
    <polygon points="80,86 98,106 98,116 80,100 62,116 62,106" fill="url(#slv-core)"/>
</g>
</svg>