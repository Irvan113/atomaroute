<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none" class="w-full h-full">
  <defs>
    <filter id="brz-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#c2410c" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="brz-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <linearGradient id="brz-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
    <linearGradient id="brz-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#431407"/>
    </linearGradient>
    <linearGradient id="brz-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>

  <g filter="url(#brz-shadow)">
    <!-- Outer Wing Chevron 1 -->
    <path d="M26 62 L40 50 L40 76 L26 88 Z" fill="url(#brz-left)" opacity="0.85"/>
    <path d="M134 62 L120 50 L120 76 L134 88 Z" fill="url(#brz-right)" opacity="0.85"/>

    <!-- Main Shield Frame - Left Half (Highlight) -->
    <polygon points="80,18 36,44 36,96 80,138" fill="url(#brz-left)"/>
    <!-- Main Shield Frame - Right Half (Shadow) -->
    <polygon points="80,18 124,44 124,96 80,138" fill="url(#brz-right)"/>

    <!-- Inner Shield Inset Plate -->
    <polygon points="80,28 46,49 46,90 80,124" fill="url(#brz-dark)"/>
    <polygon points="80,28 114,49 114,90 80,124" fill="#290c04"/>

    <!-- Center Chevron Emblem (Promosi Tier 1) -->
    <polygon points="80,48 98,66 98,78 80,62 62,78 62,66" fill="url(#brz-core)"/>
    <polygon points="80,72 98,90 98,102 80,86 62,102 62,90" fill="url(#brz-core)"/>
</g>
</svg>