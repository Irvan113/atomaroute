<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="impGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF9C3"/>
      <stop offset="30%" stop-color="#FDE047"/>
      <stop offset="60%" stop-color="#EAB308"/>
      <stop offset="90%" stop-color="#CA8A04"/>
      <stop offset="100%" stop-color="#854D0E"/>
    </linearGradient>
    <linearGradient id="impGoldLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FACC15"/>
    </linearGradient>
    <linearGradient id="impGoldDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CA8A04"/>
      <stop offset="100%" stop-color="#713F12"/>
    </linearGradient>
    <linearGradient id="impRuby" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCA5A5"/>
      <stop offset="50%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </linearGradient>
    <linearGradient id="impCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5F3FC"/>
      <stop offset="50%" stop-color="#0891B2"/>
      <stop offset="100%" stop-color="#164E63"/>
    </linearGradient>
    <filter id="impGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#78350F" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Circular Ring Border Accent (Avatar fits at cx=60, cy=63, r=42) -->
  <g filter="url(#impGlow)">
    <!-- Outer Filigree Ring (Dash/Arc) -->
    <circle cx="60" cy="63" r="44" stroke="url(#impGoldGrad)" stroke-width="2.5" fill="none"/>
    <circle cx="60" cy="63" r="41.5" stroke="#FEF08A" stroke-width="0.8" stroke-dasharray="3 3" fill="none" opacity="0.8"/>

    <!-- Laurel Leaves Left -->
    <!-- Leaf 1 (bottom left) -->
    <path d="M28 88 C20 84 18 76 26 78 C28 82 28 86 28 88 Z" fill="url(#impGoldLight)"/>
    <path d="M26 78 C22 75 22 70 28 73 C28 75 27 77 26 78 Z" fill="url(#impGoldDark)"/>
    <!-- Leaf 2 (mid left) -->
    <path d="M22 70 C14 66 14 58 22 61 C23 65 23 68 22 70 Z" fill="url(#impGoldLight)"/>
    <path d="M22 61 C17 57 18 52 24 55 C24 58 23 60 22 61 Z" fill="url(#impGoldDark)"/>
    <!-- Leaf 3 (top left) -->
    <path d="M23 52 C16 47 18 40 25 43 C26 47 25 50 23 52 Z" fill="url(#impGoldLight)"/>
    <path d="M25 43 C21 38 24 33 29 37 C28 40 27 42 25 43 Z" fill="url(#impGoldDark)"/>

    <!-- Laurel Leaves Right (Mirrored) -->
    <!-- Leaf 1 (bottom right) -->
    <path d="M92 88 C100 84 102 76 94 78 C92 82 92 86 92 88 Z" fill="url(#impGoldLight)"/>
    <path d="M94 78 C98 75 98 70 92 73 C92 75 93 77 94 78 Z" fill="url(#impGoldDark)"/>
    <!-- Leaf 2 (mid right) -->
    <path d="M98 70 C106 66 106 58 98 61 C97 65 97 68 98 70 Z" fill="url(#impGoldLight)"/>
    <path d="M98 61 C103 57 102 52 96 55 C96 58 97 60 98 61 Z" fill="url(#impGoldDark)"/>
    <!-- Leaf 3 (top right) -->
    <path d="M97 52 C104 47 102 40 95 43 C94 47 95 50 97 52 Z" fill="url(#impGoldLight)"/>
    <path d="M95 43 C99 38 96 33 91 37 C92 40 93 42 95 43 Z" fill="url(#impGoldDark)"/>

    <!-- Bottom Imperial Crest / Ribbon Knot -->
    <g transform="translate(60, 107)">
      <polygon points="0,-3 4,0 0,3 -4,0" fill="url(#impGoldLight)"/>
      <circle cx="0" cy="0" r="3.5" fill="url(#impRuby)"/>
      <circle cx="-0.8" cy="-0.8" r="1" fill="#FFF" opacity="0.8"/>
      <!-- Ribbon Tails -->
      <polygon points="-2,2 -8,10 -3,8 0,3" fill="url(#impGoldDark)"/>
      <polygon points="2,2 8,10 3,8 0,3" fill="url(#impGoldDark)"/>
    </g>

    <!-- Side Jewels -->
    <!-- Left Jewel -->
    <circle cx="19" cy="63" r="2" fill="url(#impCyan)"/>
    <circle cx="18.5" cy="62.5" r="0.7" fill="#FFF"/>
    <!-- Right Jewel -->
    <circle cx="101" cy="63" r="2" fill="url(#impCyan)"/>
    <circle cx="100.5" cy="62.5" r="0.7" fill="#FFF"/>

    <!-- IMPERIAL CROWN AT THE TOP (cx=60, resting on y=23) -->
    <g transform="translate(60, 16)">
      <!-- Crown Base Rim -->
      <path d="M-28 10 Q0 16 28 10 L29 14 Q0 20 -29 14 Z" fill="url(#impGoldDark)"/>
      <path d="M-26 9 Q0 15 26 9 L27 12 Q0 18 -27 12 Z" fill="url(#impGoldLight)"/>

      <!-- Left Outer Spire -->
      <polygon points="-28,10 -22,4 -24,-8 -17,2 -14,8" fill="url(#impGoldDark)"/>
      <polygon points="-24,-8 -19,-1 -22,4" fill="url(#impGoldLight)"/>
      <circle cx="-24" cy="-8" r="2" fill="url(#impGoldLight)"/>
      <circle cx="-24" cy="-8" r="0.8" fill="#FFF"/>

      <!-- Right Outer Spire -->
      <polygon points="28,10 22,4 24,-8 17,2 14,8" fill="url(#impGoldDark)"/>
      <polygon points="24,-8 19,-1 22,4" fill="url(#impGoldLight)"/>
      <circle cx="24" cy="-8" r="2" fill="url(#impGoldLight)"/>
      <circle cx="24" cy="-8" r="0.8" fill="#FFF"/>

      <!-- Left Mid Spire -->
      <polygon points="-17,2 -11,-14 -5,2 -10,7" fill="url(#impGoldLight)"/>
      <polygon points="-11,-14 -5,2 -8,8 -14,8" fill="url(#impGoldDark)"/>
      <polygon points="-11,-14 -9,-12 -11,-10 -13,-12" fill="url(#impCyan)"/>

      <!-- Right Mid Spire -->
      <polygon points="17,2 11,-14 5,2 10,7" fill="url(#impGoldDark)"/>
      <polygon points="11,-14 5,2 8,8 14,8" fill="url(#impGoldLight)"/>
      <polygon points="11,-14 9,-12 11,-10 13,-12" fill="url(#impCyan)"/>

      <!-- Center Grand Spire -->
      <polygon points="0,-21 -8,0 0,9" fill="url(#impGoldLight)"/>
      <polygon points="0,-21 8,0 0,9" fill="url(#impGoldDark)"/>
      <polygon points="0,-21 -2,1 0,9 2,1" fill="#FFFBEB" opacity="0.7"/>

      <!-- Star Diamond Atop Center Spire -->
      <polygon points="0,-25 2,-21 6,-19 2,-17 0,-13 -2,-17 -6,-19 -2,-21" fill="#FFFBEB"/>
      <polygon points="0,-22 1,-20 3,-19 1,-18 0,-16 -1,-18 -3,-19 -1,-20" fill="url(#impRuby)"/>

      <!-- Central Royal Ruby Medallion -->
      <polygon points="0, -2 5,4 0,10 -5,4" fill="url(#impGoldDark)"/>
      <polygon points="0, 0 4,4 0,8 -4,4" fill="url(#impRuby)"/>
      <polygon points="0, 2 1.5,4 0,6 -1.5,4" fill="#FFF" opacity="0.7"/>

      <!-- Base Band Gems -->
      <circle cx="0" cy="14" r="2" fill="url(#impRuby)"/>
      <circle cx="-0.5" cy="13.5" r="0.6" fill="#FFF"/>
      <circle cx="-11" cy="13" r="1.5" fill="url(#impCyan)"/>
      <circle cx="11" cy="13" r="1.5" fill="url(#impCyan)"/>
      <circle cx="-20" cy="11.5" r="1.2" fill="url(#impRuby)"/>
      <circle cx="20" cy="11.5" r="1.2" fill="url(#impRuby)"/>

      <!-- Sparkle Star Glints -->
      <path d="M-12 -6 Q-11 -8 -10 -6 Q-8 -5 -10 -4 Q-11 -2 -12 -4 Q-14 -5 -12 -6 Z" fill="#FFF" opacity="0.9"/>
      <path d="M12 -6 Q13 -8 14 -6 Q16 -5 14 -4 Q13 -2 12 -4 Q10 -5 12 -6 Z" fill="#FFF" opacity="0.9"/>
    </g>
  </g>
</svg>