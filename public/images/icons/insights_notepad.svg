<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- Minimalist Soft Container -->
  <rect x="14" y="14" width="100" height="100" rx="28" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2.5"/>

  <!-- Minimalist Sheet of Paper / Notepad -->
  <rect x="32" y="26" width="64" height="76" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2.5"/>

  <!-- Top Clipboard Header Clip -->
  <rect x="48" y="20" width="32" height="10" rx="4" fill="#3b82f6"/>
  <circle cx="64" cy="25" r="2" fill="#ffffff"/>

  <!-- Checklist Lines -->
  <!-- Row 1: Checkbox + Line -->
  <circle cx="44" cy="46" r="3.5" fill="#10b981"/>
  <line x1="54" y1="46" x2="84" y2="46" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>

  <!-- Row 2: Checkbox + Line -->
  <circle cx="44" cy="62" r="3.5" fill="#10b981"/>
  <line x1="54" y1="62" x2="78" y2="62" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>

  <!-- Row 3: Checkbox + Line -->
  <circle cx="44" cy="78" r="3.5" fill="#cbd5e1"/>
  <line x1="54" y1="78" x2="82" y2="78" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>

  <!-- Subtle Clean Pencil Accent -->
  <path d="M84 76 L92 68 L98 74 L90 82 Z" fill="#f59e0b"/>
  <polygon points="84,76 83,83 90,82" fill="#475569"/>
</svg>
