  <!-- Outer Bullseye Ring -->
  <circle cx="64" cy="64" r="38" stroke="#3b82f6" stroke-width="3.5" fill="#ffffff"/>

  <!-- Middle Ring -->
  <circle cx="64" cy="64" r="26" stroke="#93c5fd" stroke-width="3" fill="#dbeafe"/>

