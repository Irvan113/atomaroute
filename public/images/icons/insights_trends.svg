<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- Minimalist Soft Container -->
  <rect x="14" y="14" width="100" height="100" rx="28" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2.5"/>

  <!-- Minimalist Baseline / Axis -->
  <line x1="28" y1="92" x2="100" y2="92" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
  <line x1="28" y1="40" x2="28" y2="92" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>

  <!-- Soft Minimalist Area Fill -->
  <path d="M28 84 Q 46 80, 56 64 T 84 50 T 100 36 L 100 92 L 28 92 Z" fill="#dcfce7" opacity="0.6"/>

  <!-- Smooth Minimalist Trend Line -->
  <path d="M28 84 Q 46 80, 56 64 T 84 50 T 100 36" 
        stroke="#10b981" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Minimalist Data Nodes -->
  <circle cx="28" cy="84" r="4.5" fill="#ffffff" stroke="#10b981" stroke-width="2.5"/>
  <circle cx="56" cy="64" r="4.5" fill="#ffffff" stroke="#10b981" stroke-width="2.5"/>
  <circle cx="84" cy="50" r="4.5" fill="#ffffff" stroke="#10b981" stroke-width="2.5"/>
  <circle cx="100" cy="36" r="6" fill="#10b981" stroke="#ffffff" stroke-width="2.5"/>

  <!-- Clean Upward Mini Arrow -->
  <path d="M92 24 L104 24 L104 36" stroke="#059669" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
