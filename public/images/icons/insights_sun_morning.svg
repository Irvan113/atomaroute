<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="sm-sun" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    <linearGradient id="sm-horizon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3E64FF" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#3E64FF"/>
      <stop offset="100%" stop-color="#3E64FF" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Horizon Line -->
  <line x1="4" y1="36" x2="44" y2="36" stroke="url(#sm-horizon)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Rising Sun Disk -->
  <path d="M12 36 A12 12 0 0 1 36 36 Z" fill="url(#sm-sun)"/>

  <!-- Morning Sunrise Rays -->
  <line x1="24" y1="14" x2="24" y2="18" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="14" y1="18" x2="17" y2="21" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <line x1="34" y1="18" x2="31" y2="21" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <line x1="8" y1="28" x2="12" y2="29" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <line x1="40" y1="28" x2="36" y2="29" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>

  <!-- Ocean / Horizon Reflection Rhythms -->
  <line x1="16" y1="40" x2="32" y2="40" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="20" y1="43" x2="28" y2="43" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
</svg>
