<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- Minimalist Soft Container -->
  <rect x="14" y="14" width="100" height="100" rx="28" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2.5"/>

  <!-- Friendly Minimalist Robot / Coach Head -->
  <rect x="34" y="42" width="60" height="48" rx="18" fill="#3b82f6"/>

  <!-- Head Antenna -->
  <line x1="64" y1="28" x2="64" y2="42" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
  <circle cx="64" cy="26" r="4.5" fill="#60a5fa"/>

  <!-- Soft White Face Screen -->
  <rect x="42" y="52" width="44" height="28" rx="10" fill="#ffffff"/>

  <!-- Friendly Eyes -->
  <circle cx="52" cy="64" r="3.5" fill="#1d4ed8"/>
  <circle cx="76" cy="64" r="3.5" fill="#1d4ed8"/>

  <!-- Gentle Happy Smile -->
  <path d="M60 71 Q64 74 68 71" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Cute Ear Nodes -->
  <rect x="28" y="56" width="6" height="18" rx="3" fill="#60a5fa"/>
  <rect x="94" y="56" width="6" height="18" rx="3" fill="#60a5fa"/>
</svg>
