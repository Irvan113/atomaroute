<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="rk-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#3E64FF"/>
    </linearGradient>
    <linearGradient id="rk-flame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>

  <!-- Exhaust Trail / Particles -->
  <circle cx="12" cy="40" r="2" fill="#5EDFFF" opacity="0.6"/>
  <circle cx="8" cy="44" r="1.5" fill="#f59e0b" opacity="0.5"/>

  <!-- Propulsion Flame -->
  <path d="M19 29 L11 37 C13 33 11 31 10 32 C11 29 13 29 13 25 Z" fill="url(#rk-flame)"/>
  <path d="M18 28 L14 32 C15 30 14 29 13 30 C14 28 15 28 15 26 Z" fill="#fef08a"/>

  <!-- Left Fin -->
  <path d="M18 20 L12 24 L16 30 L20 28 Z" fill="#3E64FF"/>
  <!-- Right Fin -->
  <path d="M28 30 L24 36 L30 40 L34 34 Z" fill="#3E64FF"/>

  <!-- Rocket Fuselage -->
  <path d="M38 10 C38 10 32 12 24 20 C18 26 16 32 16 32 L20 36 C20 36 26 34 32 28 C40 20 42 14 42 14 L38 10 Z" 
        fill="url(#rk-body)" 
        stroke="#1e3a8a" 
        stroke-width="1.2" 
        stroke-linejoin="round"/>

  <!-- Nose Cone Tip -->
  <path d="M34 14 C36 12 40 10 42 10 C42 12 40 16 38 18 Z" fill="#ef4444"/>

  <!-- Porthole Window -->
  <circle cx="28" cy="22" r="3" fill="#5EDFFF" stroke="#1e3a8a" stroke-width="1"/>
  <circle cx="27.5" cy="21.5" r="1" fill="#ffffff"/>
</svg>
