<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="sd-sun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="sd-beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EDFFF"/>
      <stop offset="100%" stop-color="#3E64FF"/>
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="24" cy="24" r="14" fill="#fef08a" opacity="0.3"/>

  <!-- Sun Core -->
  <circle cx="24" cy="24" r="10" fill="url(#sd-sun)" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Radial Beams -->
  <!-- Top / Bottom / Left / Right -->
  <line x1="24" y1="5" x2="24" y2="10" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="24" y1="38" x2="24" y2="43" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="5" y1="24" x2="10" y2="24" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="38" y1="24" x2="43" y2="24" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Diagonal Beams with Cyan Accent -->
  <line x1="10.5" y1="10.5" x2="14" y2="14" stroke="#5EDFFF" stroke-width="2" stroke-linecap="round"/>
  <line x1="34" y1="34" x2="37.5" y2="37.5" stroke="#5EDFFF" stroke-width="2" stroke-linecap="round"/>
  <line x1="10.5" y1="37.5" x2="14" y2="34" stroke="#5EDFFF" stroke-width="2" stroke-linecap="round"/>
  <line x1="34" y1="14" x2="37.5" y2="10.5" stroke="#5EDFFF" stroke-width="2" stroke-linecap="round"/>
</svg>
