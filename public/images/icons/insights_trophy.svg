<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- Minimalist Soft Container -->
  <rect x="14" y="14" width="100" height="100" rx="28" fill="#fffbeb" stroke="#fde68a" stroke-width="2.5"/>

  <!-- Trophy Handles -->
  <path d="M42 42 C28 42 28 62 44 68" stroke="#d97706" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M86 42 C100 42 100 62 84 68" stroke="#d97706" stroke-width="3.5" stroke-linecap="round" fill="none"/>

  <!-- Main Cup Bowl -->
  <path d="M38 34 H90 V56 C90 70 78 80 64 80 C50 80 38 70 38 56 Z" 
        fill="#fbbf24" 
        stroke="#d97706" 
        stroke-width="3.5" 
        stroke-linejoin="round"/>

  <!-- Stem -->
  <path d="M58 80 H70 V92 H58 Z" fill="#f59e0b"/>
  <line x1="64" y1="80" x2="64" y2="92" stroke="#d97706" stroke-width="3.5"/>

  <!-- Base Stand -->
  <rect x="46" y="92" width="36" height="8" rx="4" fill="#d97706"/>

  <!-- Star on Cup -->
  <polygon points="64,44 66.5,50 72.5,50 67.5,54 69.5,60 64,56 58.5,60 60.5,54 55.5,50 61.5,50" 
           fill="#ffffff"/>
</svg>
