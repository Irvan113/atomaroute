  <!-- Right Scale Pan Strings & Pan -->
  <line x1="94" y1="44" x2="86" y2="68" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="94" y1="44" x2="102" y2="68" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round"/>
