<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- Minimalist Soft Container -->
  <rect x="14" y="14" width="100" height="100" rx="28" fill="#faf5ff" stroke="#e9d5ff" stroke-width="2.5"/>

  <!-- Minimalist Clean Diamond / Crystal Silhouette -->
  <!-- Top Facets -->
  <polygon points="64,30 88,48 40,48" fill="#c084fc"/>
  <polygon points="40,48 26,48 38,30 64,30" fill="#a855f7"/>
  <polygon points="88,48 102,48 90,30 64,30" fill="#a855f7"/>

  <!-- Bottom Main Facets -->
  <polygon points="40,48 88,48 64,96" fill="#9333ea"/>
  <polygon points="26,48 40,48 64,96" fill="#7e22ce"/>
  <polygon points="88,48 102,48 64,96" fill="#7e22ce"/>

  <!-- Facet Line Borders -->
  <polygon points="38,30 90,30 102,48 64,96 26,48" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Minimalist Sparkles -->
  <circle cx="98" cy="34" r="3" fill="#e9d5ff"/>
  <circle cx="30" cy="80" r="2.5" fill="#e9d5ff"/>
</svg>
