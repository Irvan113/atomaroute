<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- Soft Minimalist Rounded Dial Background -->
  <circle cx="64" cy="64" r="50" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2.5"/>

  <!-- Minimalist Clean Clock Dial -->
  <circle cx="64" cy="64" r="42" fill="#ffffff" stroke="#3b82f6" stroke-width="3"/>

  <!-- Minimalist Hour Markers -->
  <circle cx="64" cy="30" r="2.5" fill="#3b82f6"/>
  <circle cx="98" cy="64" r="2.5" fill="#94a3b8"/>
  <circle cx="64" cy="98" r="2.5" fill="#94a3b8"/>
  <circle cx="30" cy="64" r="2.5" fill="#94a3b8"/>

  <!-- Clean Hour Hand (Pointing at 10) -->
  <line x1="64" y1="64" x2="48" y2="48" stroke="#1d4ed8" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Clean Minute Hand (Pointing at 2 / 10 mins) -->
  <line x1="64" y1="64" x2="78" y2="44" stroke="#3b82f6" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Center Pin -->
  <circle cx="64" cy="64" r="5.5" fill="#1d4ed8" stroke="#ffffff" stroke-width="2"/>

  <!-- Subtle Minimalist Sun Sparkle (Golden Productivity) -->
  <circle cx="96" cy="34" r="7" fill="#fef3c7"/>
  <circle cx="96" cy="34" r="4" fill="#f59e0b"/>
</svg>
