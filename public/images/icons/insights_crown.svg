<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- Minimalist Soft Warm Container -->
  <rect x="14" y="14" width="100" height="100" rx="28" fill="#fffbeb" stroke="#fde68a" stroke-width="2.5"/>

  <!-- Minimalist 3-Point Crown Body -->
  <path d="M30 84 L32 48 L48 64 L64 38 L80 64 L96 48 L98 84 Z" 
        fill="#fbbf24" 
        stroke="#d97706" 
        stroke-width="3.5" 
        stroke-linejoin="round" 
        stroke-linecap="round"/>

  <!-- Base Band Accent -->
  <line x1="30" y1="84" x2="98" y2="84" stroke="#d97706" stroke-width="3.5" stroke-linecap="round"/>
  <rect x="36" y="88" width="56" height="6" rx="3" fill="#f59e0b"/>

  <!-- Minimalist Jewels / Balls on Peaks -->
  <circle cx="32" cy="46" r="4.5" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="64" cy="36" r="5.5" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
  <circle cx="96" cy="46" r="4.5" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Center Gem Detail -->
  <circle cx="64" cy="68" r="4" fill="#ffffff"/>
</svg>
