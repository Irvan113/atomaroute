<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" class="w-full h-full">
  <defs>
    <!-- Left Leg Gradient: Vibrant Cyan to Electric Blue -->
    <linearGradient id="atoma-left-stem" x1="0%" y1="100%" x2="70%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="45%" stop-color="#00A3FF"/>
      <stop offset="100%" stop-color="#3E64FF"/>
    </linearGradient>

    <!-- Right Leg Gradient: Electric Blue to Vivid Violet Purple -->
    <linearGradient id="atoma-right-stem" x1="20%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3E64FF"/>
      <stop offset="40%" stop-color="#6B46FE"/>
      <stop offset="80%" stop-color="#8B3DFF"/>
      <stop offset="100%" stop-color="#A828FF"/>
    </linearGradient>

    <!-- Crossbar Ribbon Gradient: Overlay fold effect -->
    <linearGradient id="atoma-crossbar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C8FF"/>
      <stop offset="50%" stop-color="#5551FF"/>
      <stop offset="100%" stop-color="#7B2CBF"/>
    </linearGradient>

    <!-- Shadow for ribbon depth -->
    <filter id="atoma-fold-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#090a1a" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Left Stem with rounded base -->
  <path d="M 22 76 C 19 76 17 73.5 18 70.5 L 43 20 C 44.5 17 47.5 17 49 20 L 59 40 L 35 76 Z" 
        fill="url(#atoma-left-stem)"/>

  <!-- Right Stem with rounded base -->
  <path d="M 45 19 C 47 16 50 16 52 19 L 81 70.5 C 82.5 73.5 80.5 76 77 76 L 62 76 C 60 76 58.5 74.5 57.5 72.5 L 51 58 L 38 32 L 45 19 Z" 
        fill="url(#atoma-right-stem)"/>

  <!-- Origami Crossbar Fold with Depth -->
  <path d="M 32 64 C 31 64 30.2 63.3 30.5 62.3 L 34.5 53.5 C 35 52.5 36 52 37 52 L 67 52 C 68.5 52 69.5 53.5 69 55 L 65.5 62.5 C 65 63.5 64 64 63 64 Z" 
        fill="url(#atoma-crossbar)" 
        filter="url(#atoma-fold-shadow)"/>

  <!-- Inner Counter Transparency Cutout accent -->
  <polygon points="48,29 39,47 57,47" fill="#ffffff" opacity="0.12"/>
</svg>
