<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <filter id="master-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#f97316" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#ea580c" flood-opacity="0.35"/>
    </filter>
    <!-- Outer Flame -->
    <linearGradient id="flame-outer" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="30%" stop-color="#dc2626"/>
      <stop offset="70%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <!-- Mid Flame -->
    <linearGradient id="flame-mid" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <!-- Core Heat -->
    <linearGradient id="flame-core" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="60%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <g filter="url(#master-glow)">
    <!-- Outer Flame Shape -->
    <path d="M60 16 
             C 66 32, 86 42, 88 64 
             C 90 82, 78 102, 60 102 
             C 42 102, 30 82, 32 64 
             C 34 50, 44 42, 48 34 
             C 42 44, 44 56, 50 62 
             C 50 48, 54 30, 60 16 Z" 
          fill="url(#flame-outer)"/>

    <!-- Left Wing Lick -->
    <path d="M40 76 C 26 72, 28 54, 38 46 C 36 56, 42 66, 40 76 Z" fill="#ea580c" opacity="0.8"/>
    <!-- Right Wing Lick -->
    <path d="M80 74 C 94 68, 92 50, 82 42 C 84 54, 78 64, 80 74 Z" fill="#f97316" opacity="0.85"/>

    <!-- Middle Layer Flame -->
    <path d="M60 38 
             C 64 48, 76 56, 76 72 
             C 76 86, 68 94, 60 94 
             C 52 94, 44 86, 44 72 
             C 44 60, 52 52, 54 46 
             C 52 52, 54 62, 58 66 
             C 58 56, 58 46, 60 38 Z" 
          fill="url(#flame-mid)"/>

    <!-- Brilliant Core -->
    <path d="M60 58 
             C 62 66, 68 72, 68 80 
             C 68 88, 64 90, 60 90 
             C 56 90, 52 88, 52 80 
             C 52 74, 56 68, 58 64 
             C 58 68, 60 72, 60 58 Z" 
          fill="url(#flame-core)"/>

    <!-- Floating Embers -->
    <circle cx="34" cy="38" r="2" fill="#fbbf24"/>
    <circle cx="86" cy="32" r="2.5" fill="#fef08a"/>
    <circle cx="60" cy="12" r="1.5" fill="#ffffff"/>
  </g>
</svg>
