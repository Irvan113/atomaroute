<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <filter id="novice-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10b981" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#059669" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="novice-leaf-left" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="60%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
    <linearGradient id="novice-leaf-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="novice-stem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <radialGradient id="novice-shine" cx="45%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g filter="url(#novice-glow)">
    <!-- Soil / Ground Mound -->
    <ellipse cx="60" cy="100" rx="34" ry="7" fill="#047857" opacity="0.2"/>
    <ellipse cx="60" cy="98" rx="26" ry="5" fill="#059669" opacity="0.3"/>

    <!-- Stem -->
    <path d="M60 98 C 60 74, 58 58, 60 48" stroke="url(#novice-stem)" stroke-width="6.5" stroke-linecap="round"/>

    <!-- Left Sprout Leaf -->
    <path d="M60 62 C 40 60, 22 46, 26 28 C 42 26, 56 42, 60 62 Z" fill="url(#novice-leaf-left)"/>
    <!-- Left Leaf Highlights -->
    <path d="M29 32 C 40 30, 52 42, 57 56" stroke="#a7f3d0" stroke-width="1.8" stroke-linecap="round" opacity="0.75"/>
    <ellipse cx="36" cy="38" rx="6" ry="3.5" transform="rotate(-30 36 38)" fill="url(#novice-shine)"/>

    <!-- Right Sprout Leaf -->
    <path d="M60 52 C 78 48, 96 32, 94 16 C 76 16, 62 34, 60 52 Z" fill="url(#novice-leaf-right)"/>
    <!-- Right Leaf Highlights -->
    <path d="M90 20 C 78 22, 66 36, 62 48" stroke="#ecfdf5" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
    <ellipse cx="80" cy="26" rx="7" ry="4" transform="rotate(30 80 26)" fill="url(#novice-shine)"/>

    <!-- Dewdrop on Right Leaf -->
    <circle cx="86" cy="22" r="3" fill="#ffffff" opacity="0.9"/>
    <circle cx="85" cy="21" r="1.2" fill="#ffffff"/>
  </g>
</svg>
