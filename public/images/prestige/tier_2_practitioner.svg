<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <filter id="practitioner-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#3e64ff" flood-opacity="0.4"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0284c7" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="blade-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="80%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="blade-right" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#60a5fa"/>
      <stop offset="80%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="gold-hilt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <g filter="url(#practitioner-glow)">
    <!-- SWORD 1: Top-Left to Bottom-Right -->
    <!-- Blade -->
    <path d="M22 22 L34 26 L86 78 L80 84 L28 32 Z" fill="url(#blade-left)"/>
    <path d="M22 22 L26 34 L80 84 L86 78 L34 26 Z" fill="#93c5fd" opacity="0.6"/>
    <!-- Blade Tip Sharp Point -->
    <polygon points="22,22 28,32 34,26" fill="#ffffff"/>
    <line x1="22" y1="22" x2="83" y2="81" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/>
    
    <!-- Crossguard 1 -->
    <path d="M72 90 L92 70 L95 73 L75 93 Z" fill="url(#gold-hilt)"/>
    <!-- Handle 1 -->
    <path d="M84 84 L96 96" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>
    <path d="M84 84 L96 96" stroke="#0ea5e9" stroke-width="2" stroke-linecap="round"/>
    <!-- Pommel 1 -->
    <circle cx="98" cy="98" r="4.5" fill="url(#gold-hilt)"/>

    <!-- SWORD 2: Top-Right to Bottom-Left -->
    <!-- Blade -->
    <path d="M98 22 L86 26 L34 78 L40 84 L92 32 Z" fill="url(#blade-right)"/>
    <path d="M98 22 L94 34 L40 84 L34 78 L86 26 Z" fill="#60a5fa" opacity="0.6"/>
    <!-- Blade Tip Sharp Point -->
    <polygon points="98,22 92,32 86,26" fill="#ffffff"/>
    <line x1="98" y1="22" x2="37" y2="81" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/>
    
    <!-- Crossguard 2 -->
    <path d="M48 90 L28 70 L25 73 L45 93 Z" fill="url(#gold-hilt)"/>
    <!-- Handle 2 -->
    <path d="M36 84 L24 96" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>
    <path d="M36 84 L24 96" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <!-- Pommel 2 -->
    <circle cx="22" cy="98" r="4.5" fill="url(#gold-hilt)"/>

    <!-- Central Crossing Crest / Shield Jewel -->
    <circle cx="60" cy="60" r="8" fill="#0f172a"/>
    <circle cx="60" cy="60" r="6" fill="#0284c7"/>
    <circle cx="60" cy="60" r="4" fill="#38bdf8"/>
    <polygon points="60,54 64,60 60,66 56,60" fill="#ffffff"/>
  </g>
</svg>
