<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <filter id="grandmaster-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#8b5cf6" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#c084fc" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="gem-top" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="gem-facet-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="gem-facet-center" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="gem-facet-right" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d8b4fe"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <g filter="url(#grandmaster-glow)">
    <!-- Crown Facet Flat Table (Top) -->
    <polygon points="42,32 78,32 94,52 60,52 26,52" fill="url(#gem-top)"/>

    <!-- Upper Corner Triangles -->
    <polygon points="42,32 26,52 46,52" fill="#9333ea"/>
    <polygon points="78,32 94,52 74,52" fill="#a855f7"/>
    <polygon points="42,32 78,32 60,52" fill="#f3e8ff" opacity="0.8"/>

    <!-- Lower Pavilions (Points down to apex) -->
    <!-- Far Left Lower -->
    <polygon points="26,52 46,52 60,98" fill="#581c87"/>
    <!-- Center-Left Lower -->
    <polygon points="46,52 60,52 60,98" fill="url(#gem-facet-left)"/>
    <!-- Center-Right Lower -->
    <polygon points="60,52 74,52 60,98" fill="url(#gem-facet-center)"/>
    <!-- Far Right Lower -->
    <polygon points="74,52 94,52 60,98" fill="url(#gem-facet-right)"/>

    <!-- Brilliant Facet Borders & Glints -->
    <line x1="26" y1="52" x2="94" y2="52" stroke="#ffffff" stroke-width="1.2" opacity="0.8"/>
    <line x1="60" y1="52" x2="60" y2="98" stroke="#ffffff" stroke-width="1.2" opacity="0.7"/>
    
    <!-- Sparkle Stars -->
    <!-- Big Sparkle Top Right -->
    <g transform="translate(86, 26)">
      <polygon points="0,-10 2.5,-2.5 10,0 2.5,2.5 0,10 -2.5,2.5 -10,0 -2.5,-2.5" fill="#ffffff"/>
      <circle cx="0" cy="0" r="1.5" fill="#fdf4ff"/>
    </g>
    <!-- Little Sparkle Bottom Left -->
    <g transform="translate(30, 72) scale(0.6)">
      <polygon points="0,-8 2,-2 8,0 2,2 0,8 -2,2 -8,0 -2,-2" fill="#ffffff" opacity="0.9"/>
    </g>
  </g>
</svg>
